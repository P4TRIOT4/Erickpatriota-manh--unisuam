<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SelNet</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,key,lock,cake,wc,mail" />

    <link rel="stylesheet" href="assets/estilos/style.css">
    <link rel="stylesheet" href="assets/estilos/midia-query.css">
</head>

<body>

    <button id="toggle-tema" aria-label="Alternar tema" title="Alternar tema"></button>

    <main>
        <section id="login">

            <div id="imagem">
                <div class="marca">
                    <div class="marca-logo">
                        <div class="marca-icone">
                            <img src="assets/img/logo.png" alt="SelNet">
                        </div>
                        <span class="marca-nome">SelNet</span>
                    </div>
                    <p class="marca-slogan">Conectando você ao que importa.</p>
                </div>
            </div>

            <div id="form">
                <p class="subtitulo">Crie sua conta</p>
                <h1>Cadastro</h1>

                <form method="post" autocomplete="on">

                    <div class="campo">
                        <label for="inome">Nome completo</label>
                        <div class="campo-inner">
                            <input type="text" name="nome" id="inome" placeholder="Seu nome completo" required maxlength="80">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="iemail">E-mail</label>
                        <div class="campo-inner">
                            <input type="email" name="email" id="iemail" placeholder="seu@email.com" autocomplete="email" required maxlength="30">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="idata">Data de nascimento</label>
                        <div class="campo-inner">
                            <input type="date" name="data" id="idata" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="sexo">Sexo</label>
                        <div class="campo-inner">
                            <select name="sexo" id="sexo" required>
                                <option value="">Selecione</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="isenha">Senha</label>
                        <div class="campo-inner">
                            <input type="password" name="senha" id="isenha" placeholder="••••••••" autocomplete="new-password" required minlength="8">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="iconfirmarSenha">Confirmar senha</label>
                        <div class="campo-inner">
                            <input type="password" name="confirmarSenha" id="iconfirmarSenha" placeholder="••••••••" required>
                        </div>
                    </div>

                    <p id="erroSenha" style="color: red; display: none; font-size: 12px; margin-top: -8px; margin-bottom: 8px;">
                        As senhas não coincidem
                    </p>

                    <input type="submit" value="Cadastrar-se" id="entrar">
                </form>

                <div class="links-form">
                    <a href="../login/login.html" class="botao">Já tenho conta</a>
                </div>
            </div>

        </section>
    </main>

     <script src="assets/js/script.js"></script>

</body>
</html>
