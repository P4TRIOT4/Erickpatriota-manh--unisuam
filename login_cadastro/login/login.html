<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SelNet</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key,lock" />
    <script src="https://kit.fontawesome.com/20d3823a9d.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/midia-query.css">
</head>

<body>

    <a href="../../telas/index.html" id="btn-home" aria-label="Voltar para a página inicial" title="Voltar para Home">
        <img src="assets/img/logo.png" alt="SelNet">
        <span>SelNet</span>
    </a>

    <main>
        <section id="login">

            <div id="imagem">
                <div class="marca">
                    <div class="marca-logo">
                        <div class="marca-icone">
                            <img src="assets/img/logo.png" alt="SelNet">
                        </div>
                        <span class="marca-nome">SelNet</span>
                    </div>
                    <p class="marca-slogan">Conectando você ao que importa.</p>
                </div>
            </div>

            <div id="form">
                <p class="subtitulo">Bem-vindo(a) de volta</p>
                <h1>Acesse sua conta</h1>

                <form action="login.php" method="post" autocomplete="on">

                    <div class="campo">
                        <label for="iemail">E-mail</label>
                        <div class="campo-inner">
                            <span class="material-symbols-outlined">key</span>
                            <input type="email" name="email" id="iemail" placeholder="seu@email.com" autocomplete="email" required maxlength="50">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="isenha">Senha</label>
                        <div class="campo-inner">
                            <span class="material-symbols-outlined">lock</span>
                            <input type="password" name="senha" id="isenha" placeholder="••••••••" autocomplete="current-password" required minlength="8">
                        </div>
                    </div>

                    <input type="submit" value="Entrar" id="entrar">

                    <div class="botoes-extras">
                        <button type="reset" id="btn-limpar">Limpar</button>
                    </div>
                </form>

                <div class="links-form">
                    <p id="esqueceu"><a href="#">Esqueci a senha</a></p>
                    <a href="../cadastro/cadastro.html" class="botao">Cadastrar-se</a>
                </div>
            </div>

        </section>
    </main>

    <!-- Painel de Acessibilidade -->
    <div id="painel-acessibilidade" aria-label="Ferramentas de acessibilidade">
        <button id="btn-acessibilidade" aria-label="Abrir ferramentas de acessibilidade" title="Acessibilidade">
            <i class="fa-solid fa-universal-access"></i>
        </button>
        <div id="opcoes-acessibilidade" role="region" aria-label="Opções de acessibilidade" style="display: none;">
            <p class="titulo-painel">Acessibilidade</p>

            <div class="grupo-acesso">
                <p class="label-grupo">Tamanho do texto</p>
                <div class="controles-fonte">
                    <button id="fonte-resetar" aria-label="Tamanho padrão">A</button>
                    <button id="fonte-aumentar" aria-label="Aumentar fonte">A+</button>
                </div>
            </div>

            <div class="grupo-acesso">
                <p class="label-grupo">Contraste</p>
                <button id="toggle-contraste" aria-pressed="false" aria-label="Ativar alto contraste">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                    Alto contraste
                </button>
            </div>
        </div>
    </div>

    <!-- Estrutura do Modal Personalizado -->
    <div id="meuModal" class="modal-fundo">
        <div class="modal-conteudo">
            <h2 id="modal-titulo">Aviso</h2>
            <p id="modal-mensagem">Mensagem do sistema.</p>
            <button class="btn-modal" onclick="fecharModal()">Entendi</button>
        </div>
    </div>

    <script src="assets/js/script.js"></script>

</body>
</html>
